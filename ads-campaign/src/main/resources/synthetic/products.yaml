  topics: [business, taxes]
  priority: 50
  excludedSegments: [minor]
  card:
    title: Расчётный счёт для бизнеса
    body: Откройте счёт для ИП онлайн, бухгалтерия и эквайринг в одном приложении.
    cta: Открыть счёт
    url: https://bank.example/business/account
  questions:
    - Как открыть расчётный счёт для ИП?
    - Нужен ли самозанятому расчётный счёт?
  positiveIntents:
    - клиент собирается открыть своё дело
    - клиент регистрирует ИП
    - клиент принимает оплату от клиентов на личную карту
    - клиент хочет подключить оплату картой в своём магазине
    - клиент стал самозанятым
  negativeIntents:
    - счёт ИП клиента заблокировали по 115-ФЗ
    - налоговая выставила клиенту требование

