  description: Перевод пенсии в банк — повышенный процент на остаток, бесплатное обслуживание и кэшбэк в аптеках.
  topics: [pension, debit_card]
  priority: 45
  excludedSegments: [minor]
  card:
    title: Пенсия на карту банка
    body: Повышенный доход на остаток и кэшбэк в аптеках для пенсионеров.
    cta: Перевести пенсию
    url: https://bank.example/pension
  questions:
    - Как перевести пенсию в этот банк?
    - Нужно ли идти в Социальный фонд, чтобы сменить банк для пенсии?
  positiveIntents:
    - клиент выходит на пенсию
    - клиент спрашивает, как получать пенсию на карту
    - клиент хочет сменить банк для получения пенсии
    - родители клиента получают пенсию наличными
  negativeIntents:
    - клиенту не пришла пенсия
    - пенсионеру звонят и просят назвать код из СМС

- key: business-account
