spring:
  application:
    name: artb-ads
  config:
    # Локальные секреты (GIGACHAT_CREDENTIALS=...) — в .env в корне репозитория; файл в .gitignore.
    # bootRun запускается из ads-demo, поэтому смотрим и на уровень выше.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/ads
    username: ads
    password: ads
  threads:
    virtual:
      enabled: true

server:
  port: 8080

ads:
  llm:
    # GigaChat API напрямую (библиотека spring-ai-gigachat): OAuth-токен по ключу авторизации,
    # обновление токена, TLS с корневым сертификатом Минцифры. Для отладки — публичный API
    # с ключом физлица и только синтетические данные; в контуре — свой base-url и ключ или сертификат.
    default-stage: { provider: gigachat, model: "${ADS_LLM_FAST_MODEL:GigaChat-2}" }        # гейт, интент
    stages:
      judge: { provider: gigachat, model: "${ADS_LLM_STRONG_MODEL:GigaChat-2-Max}" }
      ingestion: { provider: gigachat, model: "${ADS_LLM_STRONG_MODEL:GigaChat-2-Max}" }
      agent: { provider: gigachat, model: "${ADS_LLM_STRONG_MODEL:GigaChat-2-Max}" }
    gigachat:
      base-url: ${GIGACHAT_BASE_URL:https://api.giga.chat/v1/}
      auth-url: ${GIGACHAT_AUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
      credentials: ${GIGACHAT_CREDENTIALS:}          # ключ авторизации; локально — в .env
      ca-certs: ${GIGACHAT_CA_CERTS:classpath:certs/russian_trusted_root_ca.cer}   # корневой сертификат Минцифры из ресурсов ads-llm
      certificate: ${GIGACHAT_CERTIFICATE:}          # вход по сертификату вместо ключа
      private-key: ${GIGACHAT_PRIVATE_KEY:}
      read-timeout: 60s
      max-retries: 3            # сеть, 5xx и 429 — у ключа физлица лимит одновременных запросов
      max-concurrency: ${GIGACHAT_MAX_CONCURRENCY:1}   # ключ физлица пропускает один запрос за раз; в контуре — больше
    # JSON-схему GigaChat API не принимает: шлюз передаёт её инструкцией в промпте и проверяет ответ.
    masking:
      enabled: true
    embedding:
      # hashing — локальные лексические эмбеддинги, если на эмбеддинги GigaChat нет пакета токенов (402)
      provider: ${ADS_EMBEDDING_PROVIDER:gigachat}
      model: ${ADS_EMBEDDING_MODEL:Embeddings}   # вектор 1024; EmbeddingsGigaR — 2560; колонка vector без фиксированной размерности
      dimensions: 384                                  # только для hashing
  catalog:
    # 17 базовых синтетических продуктов (эмбеддинги платные — больше без нужды не заливаем).
    # Заливаются только в пустую базу; с реальным каталогом — ADS_SYNTHETIC_COUNT=0.
    synthetic-count: ${ADS_SYNTHETIC_COUNT:17}
  delivery:
    default-deadline: ${ADS_MATCHING_DEADLINE:2500ms}   # дедлайн подбора, если поверхность не прислала deadlineMs
    token-secret: ${ADS_TOKEN_SECRET:change-me-in-prod}
    offer-ttl: 30s
  targeting:
    mock-clients:
      client-risky: [bankruptcy_risk, overdue_debt]
      client-has-card: [has_credit_card, salary_client]
      client-clean: []

