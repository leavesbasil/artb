spring:
  application:
    name: artb-ads
  datasource:
    url: jdbc:postgresql://localhost:5433/ads
    username: ads
    password: ads
  threads:
    virtual:
      enabled: true

server:
  port: 8080

ads:
  llm:
    # Прод: GigaChat внутри контура через официальный прокси gpt2giga (OpenAI API → GigaChat API).
    # Ключ авторизации GigaChat живёт в gpt2giga; приложение знает только его адрес и ключ.
    # ID моделей зависят от поставки в контуре — переопределяются переменными окружения.
    default-stage: { provider: internal, model: "${ADS_LLM_FAST_MODEL:GigaChat-2-Lite}" }     # гейт, интент
    stages:
      judge: { provider: internal, model: "${ADS_LLM_STRONG_MODEL:GigaChat-2-Max}" }
      ingestion: { provider: internal, model: "${ADS_LLM_STRONG_MODEL:GigaChat-2-Max}" }
      agent: { provider: internal, model: "${ADS_LLM_STRONG_MODEL:GigaChat-2-Max}" }
    internal:
      # 8090 — порт gpt2giga по умолчанию; совпадает с llm-cli-proxy, локально вместе их не запустить.
      base-url: ${ADS_LLM_BASE_URL:http://localhost:8090/v1}
      api-key: ${ADS_LLM_API_KEY:none}
      timeout: 30s
      max-retries: 2
      # Схема инструкцией в промпте, пока не проверено, что gpt2giga переводит OpenAI json_schema
      # в структурированный вывод GigaChat. Ответ всё равно проверяется по схеме, с одним повтором.
      native-schema: false
    masking:
      enabled: true
    embedding:
      provider: internal
      model: ${ADS_EMBEDDING_MODEL:EmbeddingsGigaR}   # вектор 2560; колонка vector без фиксированной размерности
  catalog:
    synthetic-count: ${ADS_SYNTHETIC_COUNT:0}
  matching:
    deadline: 2500ms
  delivery:
    token-secret: ${ADS_TOKEN_SECRET:change-me-in-prod}
    offer-ttl: 30s
  targeting:
    mock-clients:
      client-risky: [bankruptcy_risk, overdue_debt]
      client-has-card: [has_credit_card, salary_client]
      client-clean: []

---
# Отладка через llm-cli-proxy (OpenAI-совместимый прокси к CLI, порт 8090). Только синтетические данные.
# Приложение о CLI не знает: меняется лишь адрес сервера и имена моделей.
spring.config.activate.on-profile: claude
ads:
  llm:
    default-stage: { provider: internal, model: claude/haiku }
    stages:
      judge: { provider: internal, model: claude/sonnet }
      ingestion: { provider: internal, model: claude/sonnet }
      agent: { provider: internal, model: claude/haiku }
    internal:
      base-url: ${ADS_LLM_BASE_URL:http://localhost:8090/v1}
      api-key: ${ADS_LLM_API_KEY:none}
      timeout: 180s          # вызов CLI — секунды, плюс один повтор в прокси при зависании
      max-retries: 0         # повторяет прокси; повтор SDK удвоил бы дорогой вызов
      native-schema: true    # прокси передаёт схему в claude --json-schema
    embedding:
      provider: hashing      # прокси эмбеддинги не отдаёт
      dimensions: 384
  catalog:
    synthetic-count: ${ADS_SYNTHETIC_COUNT:1000}
  matching:
    deadline-enabled: false

---
# То же через Qwen Code CLI: модель по умолчанию из настроек qwen.
spring.config.activate.on-profile: local
ads:
  llm:
    default-stage: { provider: internal, model: qwen }
    stages:
      judge: { provider: internal, model: qwen }
      ingestion: { provider: internal, model: qwen }
      agent: { provider: internal, model: qwen }
    internal:
      base-url: ${ADS_LLM_BASE_URL:http://localhost:8090/v1}
      api-key: ${ADS_LLM_API_KEY:none}
      timeout: 180s
      max-retries: 0
      native-schema: true    # прокси добавляет схему в промпт qwen и вырезает JSON
    embedding:
      provider: hashing
      dimensions: 384
  catalog:
    synthetic-count: ${ADS_SYNTHETIC_COUNT:1000}
  matching:
    deadline-enabled: false
