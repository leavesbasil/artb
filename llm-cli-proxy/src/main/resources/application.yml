spring:
  application:
    name: llm-cli-proxy
  threads:
    virtual:
      enabled: true

server:
  # Только локально: прокси вызывает CLI на этой машине от имени её пользователя.
  address: 127.0.0.1
  port: ${PROXY_PORT:8090}

proxy:
  timeout: 60s
  max-concurrency: 4
  api-key: ${PROXY_API_KEY:}
  claude:
    command: claude
    max-budget-usd: 0.5
  qwen:
    command: qwen
  aliases:
    fast: claude/haiku
    strong: claude/sonnet
